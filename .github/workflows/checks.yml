name: housing-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: python -m pip install -r requirements-dev.lock.txt
      - run: python -m pip check
      - run: python -m ruff check housing_model.py geographic_evaluation.py scripts tests
      - run: python -m pytest -q
      - run: python housing_model.py --input tests/fixtures/listings.csv --out runs/fixture
      - run: python geographic_evaluation.py --input tests/fixtures/listings.csv --out runs/geographic-fixture
      - run: python scripts/check_notebook.py
